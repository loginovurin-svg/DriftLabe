name: Build LogBox debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-debug:
    name: Build and verify arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
      JITPACK_NDK_VERSION: 28.1.13356709

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.1.13356709"

      - name: Build debug APKs
        working-directory: app-source/termux-app
        run: |
          chmod +x ./gradlew
          test -f ../scripts/patch-termux-bootstrap.py
          ./gradlew --no-daemon --max-workers=2 --console=plain \
            :app:assembleDebug

      - name: Verify arm64 APK and write checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app-source/termux-app/app/build/outputs/apk/debug/*_arm64-v8a.apk)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "Expected exactly one arm64-v8a APK; found ${#apks[@]}."
            find app-source/termux-app/app/build/outputs/apk/debug -maxdepth 1 -type f -print || true
            exit 1
          fi

          apk="${apks[0]}"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          badging="$("$tools/aapt" dump badging "$apk")"
          grep -q "package: name='com.logbox'" <<< "$badging"
          grep -q "versionName='0.118.5'" <<< "$badging"
          "$tools/apksigner" verify --verbose "$apk"
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v6
        with:
          name: LogBox-debug-arm64-v8a
          path: |
            app-source/termux-app/app/build/outputs/apk/debug/*_arm64-v8a.apk
            app-source/termux-app/app/build/outputs/apk/debug/*_arm64-v8a.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
